services:
  postgres:
    image: postgres:18
    container_name: hsif-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hsif
      POSTGRES_USER: hsif
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private environment}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - hsif_postgres_data:/var/lib/postgresql

volumes:
  hsif_postgres_data:
