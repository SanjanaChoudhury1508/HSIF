<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="530" viewBox="0 0 1284 530">
<title>Human-state observation validity</title>
<desc>Figure 2.11. Valid audio, unusable audio, and text-only turns remain distinct.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="642.0" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#18324b">Human-state observation validity</text>
<path d="M 240.0 192.0 L 240.0 234.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M 642.0 192.0 L 642.0 234.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M 906.0 192.0 L 780.0 234.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M 240.0 326.0 L 240.0 368.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M 822.0 280.0 L 864.0 280.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M 864.0 310.0 L 420.0 384.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M 420.0 414.0 L 462.0 414.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="100" width="360" height="92" rx="12" fill="#eaf1f6" stroke="#8da2b5" stroke-width="1.5"/>
<text x="240.0" y="146.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Valid audio features</text>
<rect x="462" y="100" width="360" height="92" rx="12" fill="#f4f7f9" stroke="#8da2b5" stroke-width="1.5"/>
<text x="642.0" y="135.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Audio present; required features</text>
<text x="642.0" y="158.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">unusable</text>
<rect x="864" y="100" width="360" height="92" rx="12" fill="#eaf1f6" stroke="#8da2b5" stroke-width="1.5"/>
<text x="1044.0" y="146.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Text-only request</text>
<rect x="60" y="234" width="360" height="92" rx="12" fill="#f4f7f9" stroke="#8da2b5" stroke-width="1.5"/>
<text x="240.0" y="269.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Observation valid; emotion may be</text>
<text x="240.0" y="292.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Neutral</text>
<rect x="462" y="234" width="360" height="92" rx="12" fill="#eaf1f6" stroke="#8da2b5" stroke-width="1.5"/>
<text x="642.0" y="269.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Not measured / unknown;</text>
<text x="642.0" y="292.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">observation_valid=false</text>
<rect x="864" y="234" width="360" height="92" rx="12" fill="#f4f7f9" stroke="#8da2b5" stroke-width="1.5"/>
<text x="1044.0" y="269.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Text source=text_only; invalid</text>
<text x="1044.0" y="292.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">audio remains audio-sourced</text>
<rect x="60" y="368" width="360" height="92" rx="12" fill="#eaf1f6" stroke="#8da2b5" stroke-width="1.5"/>
<text x="240.0" y="403.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Do not fuse unmeasured values as</text>
<text x="240.0" y="426.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">fresh observations</text>
<rect x="462" y="368" width="360" height="92" rx="12" fill="#f4f7f9" stroke="#8da2b5" stroke-width="1.5"/>
<text x="642.0" y="403.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">UI says Not measured; hides</text>
<text x="642.0" y="426.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">emotion meters</text>
</svg>
