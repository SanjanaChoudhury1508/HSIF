<path d="M 332.0 502.0 L 952.0 192.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="100" width="360" height="92" rx="12" fill="#eaf1f6" stroke="#8da2b5" stroke-width="1.5"/>
<text x="240.0" y="146.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Connect /ws/session/{session_id}</text>
<rect x="462" y="100" width="360" height="92" rx="12" fill="#f4f7f9" stroke="#8da2b5" stroke-width="1.5"/>
<text x="642.0" y="146.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">start_session → session_ready</text>
<rect x="864" y="100" width="360" height="92" rx="12" fill="#eaf1f6" stroke="#8da2b5" stroke-width="1.5"/>
<text x="1044.0" y="146.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Binary 16 kHz mono PCM chunks</text>
<rect x="60" y="234" width="360" height="92" rx="12" fill="#f4f7f9" stroke="#8da2b5" stroke-width="1.5"/>
<text x="240.0" y="269.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">speech_chunk: chunk</text>
<text x="240.0" y="292.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">timing/activity metadata</text>
<rect x="462" y="234" width="360" height="92" rx="12" fill="#eaf1f6" stroke="#8da2b5" stroke-width="1.5"/>
<text x="642.0" y="280.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Turn buffer (10 MiB limit)</text>
<rect x="864" y="234" width="360" height="92" rx="12" fill="#f4f7f9" stroke="#8da2b5" stroke-width="1.5"/>
<text x="1044.0" y="269.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">transcript_partial: periodic</text>
<text x="1044.0" y="292.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">transcript</text>
