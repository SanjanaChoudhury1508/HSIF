<text x="240.0" y="414.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">end_turn</text>
<rect x="462" y="368" width="360" height="92" rx="12" fill="#f4f7f9" stroke="#8da2b5" stroke-width="1.5"/>
<text x="642.0" y="403.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">Full-recording pipeline in thread</text>
<text x="642.0" y="426.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">pool</text>
<rect x="864" y="368" width="360" height="92" rx="12" fill="#eaf1f6" stroke="#8da2b5" stroke-width="1.5"/>
<text x="1044.0" y="381.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">transcript_final,</text>
<text x="1044.0" y="404.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">human_state_update,</text>
<text x="1044.0" y="427.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">dialogue_strategy,</text>
<text x="1044.0" y="450.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">assistant_response</text>
<rect x="60" y="502" width="360" height="92" rx="12" fill="#f4f7f9" stroke="#8da2b5" stroke-width="1.5"/>
<text x="240.0" y="537.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">error event: recoverable flag /</text>
<text x="240.0" y="560.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">code / message</text>
<rect x="462" y="502" width="360" height="92" rx="12" fill="#eaf1f6" stroke="#8da2b5" stroke-width="1.5"/>
<text x="642.0" y="548.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">end_session or disconnect</text>
</svg>
