<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="664" viewBox="0 0 1284 664">
<title>Live microphone WebSocket workflow</title>
<desc>Figure 2.6. Implemented buffered live-audio protocol; final turn processing remains full-recording.</desc>
