<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="440" viewBox="0 0 1284 440">
<title>PostgreSQL entity–relationship model</title>
<desc>Figure 2.15. SQLAlchemy session and conversation-turn tables; schema shown from model declarations.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="642.0" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#18324b">PostgreSQL entity–relationship model</text>
<path d="M 420.0 235.0 L 462.0 235.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="100" width="360" height="270" rx="12" fill="#eaf1f6" stroke="#8da2b5" stroke-width="1.5"/>
<text x="240.0" y="202.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">sessions</text>
<text x="240.0" y="225.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">PK id VARCHAR(100)</text>
<text x="240.0" y="248.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">created_at TIMESTAMP NOT NULL</text>
<text x="240.0" y="271.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">updated_at TIMESTAMP NOT NULL</text>
<rect x="462" y="100" width="360" height="270" rx="12" fill="#f4f7f9" stroke="#8da2b5" stroke-width="1.5"/>
<text x="642.0" y="136.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">conversation_turns</text>
<text x="642.0" y="159.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">PK id INTEGER</text>
<text x="642.0" y="182.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">session_id VARCHAR(100) FK NOT</text>
<text x="642.0" y="205.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">NULL</text>
<text x="642.0" y="228.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">user_message TEXT NOT NULL</text>
<text x="642.0" y="251.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">assistant_message TEXT NOT NULL</text>
<text x="642.0" y="274.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">human_state JSONB NOT NULL</text>
<text x="642.0" y="297.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">dialogue_strategy VARCHAR(100) NOT</text>
<text x="642.0" y="320.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">NULL</text>
<text x="642.0" y="343.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#20364b">created_at TIMESTAMP NOT NULL</text>
