<text x="668.88" y="249" font-family="Arial,sans-serif" font-size="16" fill="#20364b">15.6 %</text>
<text x="330" y="344" text-anchor="end" font-family="Arial,sans-serif" font-size="17" fill="#20364b">Happy/neutral/sad accuracy</text>
<rect x="350" y="314" width="877.14" height="40" rx="5" fill="#477a9e"/>
<text x="1237.1399999999999" y="341" font-family="Arial,sans-serif" font-size="16" fill="#20364b">44.3 %</text>
